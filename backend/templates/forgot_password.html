<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Blockchain Voting System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(15, 23, 42, 0.35),
                    rgba(15, 23, 42, 0.35)
                ),
                url("{{ url_for('static', filename='images/b9 background.jpeg') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Forgot Password?</h2>

    <p class="subtitle">
        Enter your registered phone number and create a new password.
    </p>

    <form onsubmit="resetPassword(event)">

        <label>Phone Number</label>
        <input
            type="text"
            id="phone"
            placeholder="Enter 10-digit phone number"
            maxlength="10"
            required
        >

        <label>New Password</label>
        <input
            type="password"
            id="new_password"
            placeholder="Enter new password"
            required
        >

        <label>Confirm Password</label>
        <input
            type="password"
            id="confirm_password"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <div id="message"></div>

    <a href="/" class="back">
        ← Back to Login
    </a>

</div>

<script>
async function resetPassword(event) {

    event.preventDefault();

    const phone = document.getElementById("phone").value.trim();
    const newPassword = document.getElementById("new_password").value;
    const confirmPassword = document.getElementById("confirm_password").value;
    const message = document.getElementById("message");

    if (!/^\d{10}$/.test(phone)) {
        message.style.color = "red";
        message.textContent = "Enter a valid 10-digit phone number.";
        return;
    }

    if (newPassword !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
    }

    const passwordPattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&*!]).{8,}$/;

    if (!passwordPattern.test(newPassword)) {
        message.style.color = "red";
        message.textContent =
            "Password must contain 8+ characters, uppercase, lowercase, number and special character.";
        return;
    }

    try {

        const response = await fetch("/forgot-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                new_password: newPassword
            })
        });

        const data = await response.json();

        if (data.success) {

            message.style.color = "green";
            message.textContent = data.message;

            setTimeout(() => {
                window.location.href = "/";
            }, 1500);

        } else {

            message.style.color = "red";
            message.textContent = data.message;
        }

    } catch (error) {

        message.style.color = "red";
        message.textContent =
            "Something went wrong. Please try again.";
    }
}
</script>

</body>
</html>
